<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>График отпусков</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080b14;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    /* На мобильных — на весь экран, включая безопасные зоны (iPhone) */
    @supports (height: 100dvh) {
      iframe { height: 100dvh; }
    }
  </style>
</head>
<body>
  <iframe
    src="ВАШ_URL_ВЕБ_ПРИЛОЖЕНИЯ"
    allow="clipboard-write"
    title="График отпусков">
  </iframe>
</body>
</html>
