<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>График отпусков</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080b14;
      -webkit-text-size-adjust: 100%;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    @supports (height: 100dvh) {
      iframe { height: 100dvh; }
    }
  </style>
</head>
<body>
  <iframe
    src="https://script.google.com/macros/s/AKfycbx-9noyDHGNECIbR2hfhHXet0-mOnWtFbG8_wd0A1HZfYs7NnPnwUhCWyN72go1R-p6/exec"
    allow="clipboard-write"
    title="График отпусков">
  </iframe>
</body>
</html>
